openapi: 3.1.0
info:
  title: Petstore Commerce API
  version: 1.4.0
  description: >-
    Public REST API for the Petstore Commerce platform. Manage users, place
    orders, and authenticate clients.
  contact:
    name: Petstore Platform Team
    email: api@petstore.example.com
servers:
  - url: https://api.petstore.example.com/api/v1
    description: Production

paths:
  /users:
    get:
      operationId: listUsers
      summary: List users
      tags: [ Users ]
      parameters:
        - name: pageSize
          in: query
          description: Number of users per page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: limit
          in: query
          description: Maximum number of users to return.
          schema:
            type: integer
        - name: role
          in: query
          description: Filter by role.
          schema:
            type: string
            enum: [ admin, member ]
      responses:
        '200':
          description: A page of users.
          content:
            application/json:
              schema:
                type: object
                required: [ users, total ]
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  total:
                    type: integer
    post:
      operationId: createUser
      summary: Create a user
      tags: [ Users ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
              properties:
                email:
                  type: string
                  format: email
                name:
                  type: string
                  maxLength: 120
                role:
                  type: string
                  enum: [ admin, member ]
                  default: member
      responses:
        '201':
          description: The created user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /orders:
    get:
      operationId: listOrders
      summary: List orders
      tags: [ Orders ]
      parameters:
        - name: status
          in: query
          description: Filter orders by status.
          schema:
            type: string
            enum:
              - pending
              - paid
              - shipped
              - cancelled
              - refunded
      responses:
        '200':
          description: All orders visible to the caller.
          content:
            application/json:
              schema:
                type: object
                required: [ orders ]
                properties:
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
      security:
        - bearerAuth: []
    post:
      operationId: createOrder
      summary: Place an order
      tags: [ Orders ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ items ]
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/OrderItem'
                couponCode:
                  type: string
            examples:
              createOrderExample:
                summary: Place an order with one item and an optional coupon
                value:
                  items:
                    - productId: prod_abc123
                      quantity: 2
                  couponCode: SAVE10
      responses:
        "201":
          description: The created order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
      security:
        - bearerAuth: []

  /auth/login:
    post:
      operationId: login
      summary: Exchange credentials for a Bearer token
      tags: [ Auth ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ email, password ]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: A short-lived access token.
          content:
            application/json:
              schema:
                type: object
                required: [ token, expiresIn ]
                properties:
                  token:
                    type: string
                  expiresIn:
                    type: integer
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identifier of the user.
        schema:
          type: string
    get:
      operationId: getUser
      summary: Fetch a single user
      tags:
        - Users
      responses:
        "200":
          description: The requested user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              example:
                id: 7f96b3a2-9c01-4f8e-9a51-1f2d3c4b5a69
                email: ada@example.com
                name: Ada Lovelace
                role: member
                createdAt: 2024-01-15T10:30:00Z
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateUser
      summary: Update a user
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                name:
                  type: string
                  maxLength: 120
                role:
                  type: string
                  enum:
                    - admin
                    - member
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orders/{orderId}/items:
    get:
      operationId: getOrderItems
      summary: Get order items
      tags:
        - Orders
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The items for the specified order.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrderItem"
        "404":
          description: Order not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    User:
      type: object
      required: [ id, email, name, role, createdAt ]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [ admin, member ]
        createdAt:
          type: string
          format: date-time
    OrderItem:
      type: object
      required: [ productId, quantity ]
      properties:
        productId:
          type: string
        quantity:
          type: integer
          minimum: 1
    Order:
      type: object
      required: [ id, status, items, totalCents, createdAt ]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - pending
            - paid
            - shipped
            - cancelled
            - refunded
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        totalCents:
          type: number
        createdAt:
          type: string
          format: date-time
    Error:
      type: object
      required: [ error ]
      properties:
        error:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
